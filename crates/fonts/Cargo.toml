[package]
name = "pdfcraft-fonts"
description = "Font metrics and text encoding helpers for generated appearances (standard fonts, WinAnsi)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
# Glyph outlines of the bundled script font (typed signatures).
# harfrust 0.14 + read-fonts 0.45 + skrifa 0.48 must move together: harfrust re-exports
# read_fonts::types, so a split version gives two incompatible FontRef types (E0308).
skrifa = { workspace = true }
# Arabic shaping for text written into PDFs.
harfrust = { workspace = true }
read-fonts = { workspace = true }
unicode-bidi = "0.3"